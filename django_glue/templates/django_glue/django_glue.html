{% load static %}
{% csrf_token %}

<script src="{% static 'django_glue/js/django_glue.js' %}?v={{ DJANGO_GLUE_VERSION }}"></script>

{{ DJANGO_GLUE_PROXIES|json_script:DJANGO_GLUE_PROXIES_SCRIPT_NAME }}

<script>
    const glueConfig = new GlueConfig({
        requestTimeoutSeconds: 30,
        actionUrlPath: '{{ DJANGO_GLUE_URLS.action }}',
        glueViewUrlPath: '{{ DJANGO_GLUE_URLS.glue_view }}',
    })

    const proxies = document.getElementById('{{ DJANGO_GLUE_PROXIES_SCRIPT_NAME }}')

    Glue.init({
        proxies: JSON.parse(document.getElementById('{{ DJANGO_GLUE_PROXIES_SCRIPT_NAME }}').textContent),
        config: glueConfig
    })
</script>
