{% load static %}
{% csrf_token %}

<script src="{% static 'django_glue/js/django_glue.js' %}?v={{ DJANGO_GLUE_VERSION }}"></script>

{{ DJANGO_GLUE_CONTEXT|json_script:DJANGO_GLUE_CONTEXT_SCRIPT_NAME }}

<script>
    const context = parseJsonScriptById('{{ DJANGO_GLUE_CONTEXT_SCRIPT_NAME }}')
    const Glue = new GlueClient(context)

    if (typeof globalThis !== 'undefined') {
        globalThis.Glue = Glue
    }
</script>
