name: CI Pipeline

on:
  push:
    branches: [master, v1/base]
  pull_request:
    branches: [master, v1/base]
  workflow_dispatch:

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stratusadv/github-actions/linting@v1
        with:
          python-version: '3.11'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: linting
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: stratusadv/github-actions/tests@v1
        with:
          python-version: ${{ matrix.python-version }}
          settings-module: test_project.settings
          sync-extras: development documentation
          manage-py-path: manage.py

  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [tests, js-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: stratusadv/github-actions/security@v1
        with:
          python-version: '3.11'
          sync-extras: ''
