{% load django_glue %}
<div data-role="deck">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
        <button type="button" class="btn btn-sm btn-gorilla" @click="component.touch()">Touch (keeps cards)</button>
        <button type="button" class="btn btn-sm btn-gorilla" @click="component.grow()">Grow (spawns a card)</button>
        <button type="button" class="btn btn-sm btn-gorilla" @click="component.shrink()">Shrink (drops a card)</button>
        <button type="button" class="btn btn-sm btn-gorilla" @click="component.open_card()">Open card (returned)</button>
        <span class="small text-muted">
            {{ component.size }} cards, touched {{ component.touches }} times, heard {{ component.cards_counted }} counts
        </span>
    </div>
    <div class="d-flex flex-wrap">
        {% for key in component.keys %}
            {% glue_component 'lab/card' start=key key=key %}
        {% endfor %}
    </div>
</div>
