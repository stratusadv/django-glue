<div class="modal fade" id="{{ modal_id }}" tabindex="-1" x-data="{
    gorilla: Glue.{{ glue_type }}.{{ glue_name }},
    saving: false,
    init() {
        this.gorilla.addListener('save', () => {
            $store.notifications.error('Failed to create fighter.');
        }, 'error');
    },
    async submit() {
        this.saving = true;
        try {
            await this.gorilla.save();
            if (!this.gorilla.hasErrors()) {
                $store.notifications.success('Fighter created successfully!');
                // The list page holds its own queryset proxy, so refreshing a
                // freshly-resolved Glue.querySet.gorillas here would not reach
                // it. Tell the list to reload instead.
                $dispatch('gorillas-changed');
                bootstrap.Modal.getInstance(document.getElementById('{{ modal_id }}')).hide();
            }
        } finally {
            this.saving = false;
        }
    }
}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-gorilla-green text-white">
                <h5 class="modal-title">{{ title|default:"Add Fighter" }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control form-control-gorilla"
                               :class="{'is-invalid': gorilla?.$fields?.name?.hasErrors}"
                               x-model="gorilla.name">
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.name?.errorText"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control form-control-gorilla" rows="2"
                                  :class="{'is-invalid': gorilla?.$fields?.description?.hasErrors}"
                                  x-model="gorilla.description"></textarea>
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.description?.errorText"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" class="form-control form-control-gorilla"
                               :class="{'is-invalid': gorilla?.$fields?.age?.hasErrors}"
                               x-model="gorilla.age" min="1" max="60">
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.age?.errorText"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Weight (kg)</label>
                        <input type="number" class="form-control form-control-gorilla"
                                  :class="{'is-invalid': gorilla?.$fields?.weight?.hasErrors}"
                               x-model="gorilla.weight" step="0.1" min="50" max="500">
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.weight?.errorText"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Height (m)</label>
                        <input type="number" class="form-control form-control-gorilla"
                               :class="{'is-invalid': gorilla?.$fields?.height?.hasErrors}"
                               x-model="gorilla.height" step="0.01" min="1.0" max="2.5">
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.height?.errorText"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Rank Points</label>
                        <input type="number" class="form-control form-control-gorilla"
                               :class="{'is-invalid': gorilla?.$fields?.rank_points?.hasErrors}"
                               x-model="gorilla.rank_points" min="0" max="10000">
                        <div class="invalid-feedback" x-text="gorilla?.$fields?.rank_points?.errorText"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-gorilla-cream">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-gorilla" @click="submit()" :disabled="saving">
                    <span x-show="!saving">Create Fighter</span>
                    <span x-show="saving">Creating...</span>
                </button>
            </div>
        </div>
    </div>
</div>
