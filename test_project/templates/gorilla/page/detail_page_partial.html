<style>
.stat-card {
    background: linear-gradient(135deg, var(--gorilla-green) 0%, var(--gorilla-green-dark) 100%);
    color: white;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
}

.stat-value {
    font-family: "Jersey 15", sans-serif;
    font-size: 2rem;
}

.stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    opacity: 0.9;
}
</style>

<div x-data="{
    gorilla: Glue.model.gorilla,
    init() {
        this.gorilla.addListener('save', event => {
            if (event.proxy.hasErrors()) {
                $store.notifications.error(`Failed to save fighter. ${this.errorSummary(event.proxy)}`, 6000);
            }
            else {
                $store.notifications.success('Fighter saved successfully!');
            }
        });
        this.gorilla.addListener('save', () => {
            $store.notifications.error('Failed to save fighter.');
        }, 'error');
        this.gorilla.addListener('delete', () => {
            $store.notifications.error('Failed to delete fighter.');
        }, 'error');
    },
    errorSummary(proxy) {
        const errors = Object.fromEntries(
            Object.entries(proxy._state || {})
                .filter(([, fieldState]) => fieldState?.errors?.length)
                .map(([field, fieldState]) => [field, fieldState.errors])
        );
        const messages = Object.entries(errors)
            .map(([field, fieldErrors]) => {
                const label = proxy.$fields?.[field]?.label || field;
                const text = Array.isArray(fieldErrors) ? fieldErrors.join(', ') : fieldErrors;
                return `${label}: ${text}`;
            });
        return messages.length ? messages.join(' ') : 'Check form for errors.';
    }
}">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-gorilla">
                <!-- Fighter Name Header -->
                <div class="card-header bg-gorilla-green text-white text-center py-3">
                    <input
                        type="text"
                        class="form-control form-control-lg bg-transparent border-0 text-white fw-bold text-center"
                        style="font-family: 'Jersey 15', sans-serif; font-size: 2rem;"
                        :class="{'is-invalid': gorilla.$fields.name.hasErrors}"
                        x-model="gorilla.name"
                        placeholder="Fighter Name">
                    <div class="invalid-feedback" x-show="gorilla.$fields.name.hasErrors" x-text="gorilla.$fields.name.errorText"></div>
                </div>

                <div class="card-body p-4">
                    <!-- Stats Row -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-3 col-6">
                            <div class="stat-card">
                                <div class="stat-value" x-text="gorilla.rank_points"></div>
                                <div class="stat-label">Rank Points</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-card">
                                <div class="stat-value" x-text="gorilla.age"></div>
                                <div class="stat-label">Age</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-card">
                                <div class="stat-value" x-text="gorilla.weight"></div>
                                <div class="stat-label">Weight (kg)</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-card">
                                <div class="stat-value" x-text="gorilla.height"></div>
                                <div class="stat-label">Height (m)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Editable Form -->
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">Fighter Description</label>
                            <textarea
                                class="form-control form-control-gorilla"
                                rows="4"
                                :class="{'is-invalid': gorilla.$fields.description.hasErrors}"
                                x-model="gorilla.description"
                                placeholder="Enter the fighter's backstory, achievements, and fighting spirit..."></textarea>
                            <div class="invalid-feedback" x-show="gorilla.$fields.description.hasErrors" x-text="gorilla.$fields.description.errorText"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Age</label>
                            <input
                                type="number"
                                class="form-control form-control-gorilla"
                                :class="{'is-invalid': gorilla.$fields.age.hasErrors}"
                                x-model="gorilla.age"
                                min="1"
                                max="60">
                            <div class="invalid-feedback" x-show="gorilla.$fields.age.hasErrors" x-text="gorilla.$fields.age.errorText"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Rank Points</label>
                            <input
                                type="number"
                                class="form-control form-control-gorilla"
                                :class="{'is-invalid': gorilla.$fields.rank_points.hasErrors}"
                                x-model="gorilla.rank_points"
                                min="0"
                                max="10000">
                            <div class="invalid-feedback" x-show="gorilla.$fields.rank_points.hasErrors" x-text="gorilla.$fields.rank_points.errorText"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Weight (kg)</label>
                            <input
                                type="number"
                                class="form-control form-control-gorilla"
                                :class="{'is-invalid': gorilla.$fields.weight.hasErrors}"
                                x-model="gorilla.weight"
                                step="0.1"
                                min="50"
                                max="500">
                            <div class="invalid-feedback" x-show="gorilla.$fields.weight.hasErrors" x-text="gorilla.$fields.weight.errorText"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Height (m)</label>
                            <input
                                type="number"
                                class="form-control form-control-gorilla"
                                :class="{'is-invalid': gorilla.$fields.height.hasErrors}"
                                x-model="gorilla.height"
                                step="0.01"
                                min="1.0"
                                max="2.5">
                            <div class="invalid-feedback" x-show="gorilla.$fields.height.hasErrors" x-text="gorilla.$fields.height.errorText"></div>
                            </div>
                    </div>
                </div>

                <div class="card-footer bg-gorilla-cream">
                    <div class="d-flex gap-2 justify-content-end">
                        <button class="btn btn-gorilla px-4" @click="gorilla.save()">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
